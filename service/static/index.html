<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Product Catalog Administration</title>
  <style>body{font:16px system-ui;max-width:760px;margin:2rem auto;padding:0 1rem}fieldset{display:grid;grid-template-columns:150px 1fr;gap:.8rem;padding:1.2rem}input,select,button{font:inherit;padding:.45rem}button{cursor:pointer}#flash{min-height:1.5rem;color:#075a2b;font-weight:bold}table{width:100%;border-collapse:collapse;margin-top:1.5rem}td,th{border:1px solid #ccc;padding:.5rem;text-align:left}</style>
</head>
<body>
  <h1>Product Catalog Administration</h1><p id="flash" role="status"></p>
  <fieldset><legend>Product</legend>
    <label for="product_id">Id</label><input id="product_id" readonly>
    <label for="product_name">Name</label><input id="product_name" required>
    <label for="product_description">Description</label><input id="product_description" required>
    <label for="product_price">Price</label><input id="product_price" type="number" min="0" step="0.01" required>
    <label for="product_available">Available</label><select id="product_available"><option>True</option><option>False</option></select>
    <label for="product_category">Category</label><select id="product_category"><option>Unknown</option><option>Cloths</option><option>Food</option><option>Housewares</option><option>Automotive</option><option>Tools</option></select>
  </fieldset>
  <p><button id="create-btn">Create</button> <button id="retrieve-btn">Retrieve</button> <button id="update-btn">Update</button> <button id="delete-btn">Delete</button> <button id="clear-btn">Clear</button> <button id="search-btn">Search</button></p>
  <table><thead><tr><th>Id</th><th>Name</th><th>Category</th><th>Available</th><th>Price</th></tr></thead><tbody id="results"></tbody></table>
  <script src="/static/app.js"></script>
</body></html>
